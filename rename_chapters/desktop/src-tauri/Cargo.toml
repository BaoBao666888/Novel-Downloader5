[package]
name = "novel-studio-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
license = "AGPL-3.0-only"
publish = false
include = ["/src/", "/capabilities/", "/build.rs", "/tauri.conf.json", "/tauri.nsis.conf.json"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.4"
serde_json = "1"
tiny_http = "0.12"
novel-studio-core = { path = "../../rust" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
