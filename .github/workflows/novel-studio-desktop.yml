name: Novel Studio Desktop

on:
  workflow_dispatch:
    inputs:
      run_ci:
        description: Run the Windows checks and build
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    if: ${{ inputs.run_ci }}
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    defaults:
      run:
        working-directory: rename_chapters/desktop
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /LICENSE
            /rename_chapters/icon.ico
            /rename_chapters/app/core/renamer.py
            /rename_chapters/rust/
            /rename_chapters/desktop/

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: rename_chapters/desktop/package-lock.json

      - name: Set up Rust
        run: rustup toolchain install 1.91.1 --profile minimal

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: ${{ runner.os }}-${{ runner.arch }}-novel-studio-desktop-${{ hashFiles('rename_chapters/desktop/src-tauri/Cargo.lock') }}

      - run: npm ci --no-audit --no-fund

      - name: Check Svelte and TypeScript
        run: npm run check

      - name: Build the frontend
        run: npm run build

      - name: Test preview selection and folder scoping
        run: cargo +1.91.1 test --locked --manifest-path src-tauri/Cargo.toml --features custom-protocol

      - name: Build the desktop development executable
        run: cargo +1.91.1 build --locked --manifest-path src-tauri/Cargo.toml --features custom-protocol
